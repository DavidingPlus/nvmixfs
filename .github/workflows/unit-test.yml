name: Unit Test

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  schedule:
    - cron: 0 4 * * *

jobs:
  unit-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davidingplus/nvmixfs-docker-runtime:latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure XMake
        working-directory: ${{github.workspace}}
        run: |

          alias xmake="~/.local/bin/xmake"
          export XMAKE_ROOT=y

          xmake f -m release --linux-headers=/usr/src/linux-headers-${KERNEL_VERSION}/ --with-gtest=true -y

      - name: Build Targets
        working-directory: ${{github.workspace}}
        run: |

          alias xmake="~/.local/bin/xmake"
          export XMAKE_ROOT=y

          xmake build tests

      - name: Run Unit Test
        working-directory: ${{github.workspace}}
        run: |

          alias xmake="~/.local/bin/xmake"
          export XMAKE_ROOT=y

          xmake run tests
